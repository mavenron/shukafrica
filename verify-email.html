<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Verify Email | ShukAfrica</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f6f7;
      font-family: Arial, sans-serif;
      color: #171717;
    }
    .container {
      width: 100%;
      max-width: 440px;
      background: #fff;
      padding: 35px 25px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,.06);
    }
    .logo { font-size: 27px; font-weight: 800; margin-bottom: 25px; }
    .logo span { color: #e58b22; }
    .icon {
      width: 75px; height: 75px; margin: 0 auto 20px;
      border-radius: 50%; display: flex; align-items: center;
      justify-content: center; background: #f1f1f1; font-size: 34px;
    }
    h1 { font-size: 25px; margin: 0 0 12px; }
    p { color: #666; line-height: 1.6; font-size: 15px; }
    #message { margin: 20px 0; font-weight: 600; }
    .success { color: #168344 !important; }
    .error { color: #c62828 !important; }
    .button {
      display: block; width: 100%; padding: 15px; margin-top: 22px;
      background: #176b45; color: #fff; border: 0;
      text-decoration: none; border-radius: 8px;
      font-weight: 700; font-size: 15px; cursor: pointer;
    }
    .button:disabled { opacity: .6; cursor: not-allowed; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo">Shuk<span>Africa</span></div>
    <div class="icon" id="icon">✉️</div>
    <h1 id="heading">Confirm your email</h1>
    <p id="message">
      Your email address is ready for verification.
      Tap the button below to activate your seller account.
    </p>

    <button class="button" id="verifyButton" type="button">
      Confirm My Email
    </button>

    <a href="/seller-signup.html?mode=login"
       class="button hidden" id="loginButton">
      Go to Seller Login
    </a>
  </main>

  <script>
    const heading = document.getElementById("heading");
    const message = document.getElementById("message");
    const icon = document.getElementById("icon");
    const verifyButton = document.getElementById("verifyButton");
    const loginButton = document.getElementById("loginButton");

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token || !/^[a-f0-9]{64}$/i.test(token)) {
      heading.textContent = "Invalid verification link";
      message.textContent =
        "This link is missing or invalid. Please request a new verification email.";
      message.className = "error";
      icon.textContent = "⚠️";
      verifyButton.classList.add("hidden");
    }

    verifyButton.addEventListener("click", async () => {
      if (!token) return;

      verifyButton.disabled = true;
      verifyButton.textContent = "Verifying...";
      message.textContent = "Please wait while we verify your email.";
      message.className = "";

      try {
        const response = await fetch("/api/auth/email-verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.error || "Email verification failed.");
        }

        heading.textContent = "Email verified!";
        message.textContent =
          "Your seller account is now active. You can log in.";
        message.className = "success";
        icon.textContent = "✓";
        verifyButton.classList.add("hidden");
        loginButton.classList.remove("hidden");

        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );
      } catch (error) {
        heading.textContent = "Verification unsuccessful";
        message.textContent = error.message;
        message.className = "error";
        icon.textContent = "⚠️";
        verifyButton.disabled = false;
        verifyButton.textContent = "Try Verification Again";
      }
    });
  </script>
</body>
</html>
