<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details — ShukAfrica</title>

<style>
:root {
  --bg: #0b0d0c;
  --panel: #151918;
  --panel2: #1c211f;
  --gold: #d7a85b;
  --text: #f5f1e8;
  --muted: #9da39f;
  --border: #2c332f;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

a { color: inherit; text-decoration: none; }

.wrap { width: min(1000px, 92%); margin: auto; }

header {
  padding: 18px 0;
  border-bottom: 1px solid var(--border);
}

.header-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.logo { font-size: 22px; font-weight: 800; color: var(--gold); }
.back { color: var(--muted); font-size: 14px; }

main { padding: 28px 0 60px; }

.product-layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
  max-width: 800px;
  margin: auto;
}

.gallery {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
}

.main-image {
  width: 100%;
  height: min(75vw, 480px);
  min-height: 240px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel2);
}

.main-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.placeholder {
  color: var(--muted);
  font-size: 16px;
}

.thumbnails {
  display: flex;
  gap: 10px;
  padding: 12px;
  overflow-x: auto;
}

.thumbnail {
  width: 76px;
  height: 76px;
  flex: 0 0 76px;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  background: var(--panel2);
  cursor: pointer;
}

.thumbnail img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.product-info { padding-top: 4px; }

.badge {
  display: inline-block;
  background: rgba(215,168,91,.12);
  color: var(--gold);
  border: 1px solid rgba(215,168,91,.3);
  padding: 6px 11px;
  border-radius: 20px;
  font-size: 12px;
  margin-bottom: 15px;
}

h1 {
  font-size: clamp(27px, 5vw, 36px);
  line-height: 1.2;
  margin-bottom: 15px;
}

.price {
  color: var(--gold);
  font-size: 30px;
  font-weight: 800;
  margin-bottom: 12px;
}

.location { color: var(--muted); margin-bottom: 22px; }

.description-box, .seller-box {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  margin-top: 18px;
}

.section-title { font-size: 17px; margin-bottom: 10px; }
.description { color: #d2d6d3; white-space: pre-wrap; overflow-wrap: anywhere; }
.seller-name { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
.seller-location { color: var(--muted); margin-bottom: 10px; }
.seller-phone { color: var(--muted); overflow-wrap: anywhere; }


.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 20px;
  align-items: center;
}

.btn {
  flex: 1 1 auto;
  width: auto;
  min-width: 0;
  border: 0;
  border-radius: 9px;
  padding: 11px 14px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  font-family: inherit;
  line-height: 1.3;
}
  

.contact { background: var(--gold); color: #111; }
.call { background: #16845b; color: #fff; display: block; }
.save { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.notice { margin-top: 20px; color: var(--muted); font-size: 13px; text-align: center; }
.error { padding: 20px; color: #ffb8b3; text-align: center; }


@media (max-width: 480px) {
  .header-inner {
    align-items: flex-start;
    flex-direction: column;
  }

  .actions {
    flex-direction: row;
    flex-wrap: wrap;
    gap: 8px;
  }

  .btn {
    flex: 1 1 auto;
    width: auto;
    padding: 12px 8px;
    font-size: 13px;
  }
}
  
</style>
</head>

<body>
<header>
  <div class="wrap header-inner">
    <a href="index.html" class="logo">SHUKAFRICA</a>
    <a href="buy-and-sell.html" class="back">← Back to Buy &amp; Sell</a>
  </div>
</header>

<main class="wrap">
  <div class="product-layout">
    <section class="gallery" aria-label="Product photos">
      <div class="main-image" id="mainImage">
        <span class="placeholder">Loading product photos…</span>
      </div>
      <div class="thumbnails" id="thumbnails"></div>
    </section>

    <section class="product-info">
      <span class="badge" id="productCategory">Loading…</span>
      <h1 id="productName">Loading product…</h1>
      <div class="price" id="productPrice"></div>
      <div class="location" id="productLocation"></div>

      <div class="description-box">
        <h2 class="section-title">Description</h2>
        <p class="description" id="productDescription"></p>
      </div>

      <div class="seller-box">
        <h2 class="section-title">Seller</h2>
        <div class="seller-name" id="sellerName">Loading seller…</div>
        <div class="seller-location" id="sellerLocation"></div>
        <div class="seller-phone" id="sellerPhone"></div>
      </div>

      <div class="actions">
        <button class="btn save" id="saveButton" type="button">♡ Save</button>
        <button class="btn contact" id="contactButton" type="button" disabled>
          WhatsApp Seller
        </button>
        <a class="btn call" id="callButton" href="tel:" aria-disabled="true">
          📞 Call Seller
        </a>
      </div>

      <p class="notice" id="notice">Loading published listing details…</p>
    </section>
  </div>
</main>

<script>
const params = new URLSearchParams(window.location.search);
const listingId = params.get("id");

const mainImage = document.getElementById("mainImage");
const thumbnails = document.getElementById("thumbnails");
const notice = document.getElementById("notice");
const contactButton = document.getElementById("contactButton");
const callButton = document.getElementById("callButton");
const saveButton = document.getElementById("saveButton");

let sellerPhone = "";
let currentListingId = "";

function setText(id, value) {
  document.getElementById(id).textContent = value || "";
}

function formatPrice(value) {
  return "GH₵ " + Number(value).toLocaleString("en-GH", {
    maximumFractionDigits: 2
  });
}

function getInternationalNumber(phone) {
  const digits = String(phone || "").replace(/\D/g, "");

  if (!digits) return "";

  // Convert Ghana local numbers to international format.
  if (digits.startsWith("0")) {
    return "233" + digits.slice(1);
  }

  // If the number is already in Ghana international format,
  // keep it. Other country codes are also preserved.
  return digits;
}

function showImages(listing) {
  const urls = [listing.image_1, listing.image_2, listing.image_3]
    .filter(url => {
      if (typeof url !== "string") return false;

      try {
        const parsed = new URL(url);
        return parsed.protocol === "https:" &&
          parsed.hostname === "media.shukafrica.com";
      } catch {
        return false;
      }
    });

  mainImage.replaceChildren();
  thumbnails.replaceChildren();

  if (!urls.length) {
    mainImage.innerHTML =
      '<span class="placeholder">No product photos available</span>';
    return;
  }

  function selectImage(url, alt) {
    mainImage.replaceChildren();

    const img = document.createElement("img");
    img.src = url;
    img.alt = alt;

    img.onerror = () => {
      mainImage.innerHTML =
        '<span class="placeholder">Photo could not be loaded</span>';
    };

    mainImage.appendChild(img);
  }

  selectImage(urls[0], listing.item_name || "Product photo");

  urls.forEach((url, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "thumbnail";
    button.setAttribute("aria-label", "View photo " + (index + 1));

    const img = document.createElement("img");
    img.src = url;
    img.alt = "Product thumbnail " + (index + 1);

    button.appendChild(img);

    button.addEventListener("click", () => {
      selectImage(
        url,
        (listing.item_name || "Product") + " photo " + (index + 1)
      );
    });

    thumbnails.appendChild(button);
  });
}

function updateContactButtons() {
  const international = getInternationalNumber(sellerPhone);

  contactButton.disabled = !international;

  if (international) {
    callButton.href = "tel:+" + international;
    callButton.removeAttribute("aria-disabled");
    callButton.style.pointerEvents = "auto";
    callButton.style.opacity = "1";
  } else {
    callButton.href = "tel:";
    callButton.setAttribute("aria-disabled", "true");
    callButton.style.pointerEvents = "none";
    callButton.style.opacity = "0.5";
  }
}

async function loadListing() {
  if (!listingId) {
    notice.textContent =
      "This link has no listing ID. Return to Buy & Sell and open the product again.";

    mainImage.innerHTML =
      '<span class="placeholder">Product not selected</span>';

    setText("productName", "Product not selected");
    setText("sellerName", "");

    contactButton.disabled = true;
    updateContactButtons();
    return;
  }

  try {
    const response = await fetch(
      "/api/marketplace-listing?id=" + encodeURIComponent(listingId),
      { cache: "no-store" }
    );

    const data = await response.json();

    if (!response.ok || !data.success || !data.listing) {
      throw new Error(data.error || "Listing unavailable.");
    }

    const item = data.listing;

    currentListingId = item.id;
    sellerPhone = item.seller_phone || "";

    setText("productCategory", item.category);
    setText("productName", item.item_name);
    setText("productPrice", formatPrice(item.price_ghs));
    setText("productLocation", "📍 " + (item.location || ""));
    setText("productDescription", item.description);
    setText("sellerName", item.seller_name);
    setText("sellerLocation", "📍 " + (item.location || ""));
    setText(
      "sellerPhone",
      sellerPhone ? "Phone: " + sellerPhone : "Seller contact unavailable"
    );

    showImages(item);

    notice.textContent = "You're viewing a published ShukAfrica listing.";

    updateContactButtons();

    // Restore the saved state for this listing.
    const key = "shukafricaSavedMarketplaceListings";

    try {
      const saved = JSON.parse(localStorage.getItem(key) || "[]");
      if (Array.isArray(saved) && saved.includes(currentListingId)) {
        saveButton.textContent = "♥ Saved";
      }
    } catch {
      // Keep the default Save button if saved data cannot be read.
    }
  } catch (error) {
    console.error(error);

    setText("productName", "Listing unavailable");
    notice.textContent = error.message || "Unable to load this product.";

    mainImage.innerHTML =
      '<span class="placeholder">Product photos unavailable</span>';

    contactButton.disabled = true;
    sellerPhone = "";
    updateContactButtons();
  }
}

contactButton.addEventListener("click", () => {
  const international = getInternationalNumber(sellerPhone);

  if (!international) {
    alert("The seller has not provided a contact number.");
    return;
  }

  const message =
    "Hello, I'm interested in your ShukAfrica listing: " +
    document.getElementById("productName").textContent +
    (currentListingId ? " (Reference: " + currentListingId + ")" : "");

  const whatsappUrl =
    "https://wa.me/" + international +
    "?text=" + encodeURIComponent(message);

  window.open(whatsappUrl, "_blank", "noopener,noreferrer");
});

saveButton.addEventListener("click", () => {
  if (!currentListingId) return;

  const key = "shukafricaSavedMarketplaceListings";
  let saved = [];

  try {
    saved = JSON.parse(localStorage.getItem(key) || "[]");
    if (!Array.isArray(saved)) saved = [];
  } catch {
    saved = [];
  }

  const index = saved.indexOf(currentListingId);

  if (index >= 0) {
    saved.splice(index, 1);
    saveButton.textContent = "♡ Save";
  } else {
    saved.push(currentListingId);
    saveButton.textContent = "♥ Saved";
  }

  localStorage.setItem(key, JSON.stringify(saved));
});

loadListing();
</script>
</body>
</html>
