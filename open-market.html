<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071112">
<title>ShukAfrica Open Market</title>

<style>
:root {
  --bg: #071112;
  --panel: #101d1e;
  --panel2: #0b1919;
  --border: #263738;
  --gold: #ffb52e;
  --muted: #a8b6b3;
  --green: #00a875;
  --white: #ffffff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--white);
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.5;
}

body.modal-open { overflow: hidden; }

a { color: inherit; text-decoration: none; }
button, input { font: inherit; }
button { cursor: pointer; }

.topbar {
  border-bottom: 1px solid var(--border);
  padding: 15px 4%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand {
  font-size: clamp(19px, 4vw, 28px);
  font-weight: 900;
  letter-spacing: -.7px;
}

.brand span { color: var(--gold); }

.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.home-link {
  color: var(--gold);
  font-weight: 700;
  white-space: nowrap;
}

.add-button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 46px;
  height: 44px;
  border: 0;
  border-radius: 12px;
  background: var(--green);
  color: white;
  font-size: 28px;
  flex-shrink: 0;
}

.container {
  width: 92%;
  max-width: 1000px;
  margin: auto;
  padding: 20px 0 35px;
}

h1 {
  font-size: clamp(29px, 6vw, 42px);
  margin: 4px 0 14px;
  line-height: 1.1;
}

.tagline {
  color: var(--gold);
  font-weight: 700;
  font-size: 18px;
  margin: 0 0 12px;
}

.intro {
  color: var(--muted);
  line-height: 1.5;
  margin: 0 0 23px;
}

.search-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 14px;
  display: grid;
  gap: 10px;
  margin-bottom: 24px;
}

.search-field {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  min-height: 56px;
  border: 1px solid #344544;
  border-radius: 15px;
  padding: 0 14px;
  background: var(--panel2);
}

.search-icon {
  color: var(--gold);
  font-size: 23px;
  flex-shrink: 0;
}

.search-field input {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: white;
  font-size: 15px;
}

.search-field input::placeholder { color: var(--muted); }

.categories {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
  margin: 0 0 30px;
}

.category-button {
  min-width: 0;
  min-height: 78px;
  padding: 9px 3px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: var(--panel);
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
}

.category-icon { font-size: 22px; }

.category-name {
  font-size: clamp(10px, 2.6vw, 13px);
  line-height: 1.2;
  text-align: center;
  overflow-wrap: anywhere;
}

.category-button.active {
  border-color: var(--gold);
  background: #20251d;
  color: var(--gold);
}

.listings-section { margin-top: 10px; }

.listings-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 16px;
}

.listings-heading h2 {
  font-size: clamp(21px, 4vw, 27px);
  margin: 0;
}

.listing-count {
  color: var(--muted);
  font-size: 14px;
  white-space: nowrap;
}

.listing-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-items: stretch;
  gap: 15px;
}

.listing-card {
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--panel);
  display: flex;
  flex-direction: column;
}

.listing-photo {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  background: #142425;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.listing-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.photo-placeholder {
  font-size: 52px;
  color: var(--muted);
}

.listing-category {
  position: absolute;
  top: 10px;
  left: 10px;
  max-width: calc(100% - 20px);
  padding: 6px 9px;
  border-radius: 8px;
  background: rgba(7,17,18,.9);
  color: var(--gold);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  overflow-wrap: anywhere;
}

.listing-info {
  padding: 14px;
  display: flex;
  flex-direction: column;
  flex: 1;
  align-items: stretch;
}

.listing-title {
  font-size: 17px;
  line-height: 1.35;
  margin: 0 0 9px;
  overflow-wrap: anywhere;
}

.listing-price {
  color: var(--gold);
  font-size: 18px;
  font-weight: 800;
  overflow-wrap: anywhere;
  margin-bottom: 9px;
}

.listing-location {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 10px;
  overflow-wrap: anywhere;
}

.listing-description {
  color: #d1d9d7;
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  white-space: pre-line;
  margin: 0 0 12px;
}

.listing-actions {
  display: flex;
  gap: 8px;
  margin-top: auto;
  padding-top: 6px;
}

.action-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  min-width: 0;
  padding: 10px 8px;
  border-radius: 9px;
  border: 1px solid transparent;
  font-size: 12px;
  line-height: 1.3;
  font-weight: 700;
}

.view-button {
  flex: 1;
  background: #203332;
  color: white;
  border-color: #314746;
}

.contact-button {
  flex: 1.3;
  background: var(--green);
  color: white;
}

.listing-message {
  grid-column: 1 / -1;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--panel);
  color: var(--muted);
  padding: 25px 16px;
  text-align: center;
  line-height: 1.6;
}

.listing-message.error { color: #ffb3ad; }

/* Listing details modal */
.details-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(0,0,0,.82);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.details-overlay[hidden] { display: none; }

.details-modal {
  width: 100%;
  max-width: 620px;
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--panel);
  border: 1px solid #344544;
  border-radius: 25px;
  padding: 20px;
  box-shadow: 0 18px 60px rgba(0,0,0,.45);
}

.modal-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

.modal-title {
  margin: 0;
  font-size: clamp(23px, 5vw, 30px);
  overflow-wrap: anywhere;
}

.modal-close {
  flex-shrink: 0;
  padding: 11px 15px;
  border: 1px solid #394b4a;
  border-radius: 12px;
  background: #243635;
  color: white;
}

.modal-price {
  color: var(--gold);
  font-size: 21px;
  font-weight: 800;
  margin: 0 0 17px;
  overflow-wrap: anywhere;
}

.media-gallery {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 23px;
}

.gallery-item {
  min-width: 0;
  overflow: hidden;
  border-radius: 14px;
  background: #071112;
  border: 1px solid var(--border);
  aspect-ratio: 4 / 3;
}

.gallery-item img,
.gallery-item video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #071112;
}

.no-media {
  grid-column: 1 / -1;
  color: var(--muted);
  text-align: center;
  padding: 22px;
  border: 1px dashed var(--border);
  border-radius: 12px;
}
  /* Fullscreen media viewer */
.media-viewer[hidden] {
  display: none;
}

.media-viewer {
  position: fixed;
  inset: 0;
  z-index: 10000;
  background: rgba(0, 0, 0, 0.96);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 55px 50px;
}

.media-viewer-content {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.media-viewer-content img,
.media-viewer-content video {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.media-viewer-content img {
  cursor: zoom-in;
  touch-action: pan-y;
}

.media-viewer-content img.zoomed {
  cursor: zoom-out;
  transform: scale(2);
  touch-action: none;
}

.media-viewer-close,
.media-viewer-nav {
  position: absolute;
  z-index: 2;
  border: 0;
  color: white;
  background: rgba(255, 255, 255, 0.16);
  border-radius: 50%;
  width: 42px;
  height: 42px;
  font-size: 22px;
  cursor: pointer;
}

.media-viewer-close {
  top: 15px;
  right: 15px;
}

.media-viewer-nav {
  top: 50%;
  transform: translateY(-50%);
}

#previousMedia {
  left: 10px;
}

#nextMedia {
  right: 10px;
}

.media-viewer-counter {
  position: absolute;
  bottom: 12px;
  color: white;
  font-size: 14px;
}

.detail-field { margin: 0 0 20px; }

.detail-label {
  display: block;
  color: var(--gold);
  font-weight: 800;
  font-size: 14px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.detail-value {
  color: #e5eae8;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin: 0;
}

.modal-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 22px;
}

.modal-contact {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  padding: 13px 16px;
  border-radius: 11px;
  font-weight: 800;
  background: var(--green);
  color: white;
}

.modal-whatsapp {
  background: #203332;
  border: 1px solid #314746;
}

.modal-footer-note {
  color: var(--muted);
  font-size: 12px;
  margin-top: 20px;
}

@media (max-width: 380px) {
  .topbar { padding-left: 3%; padding-right: 3%; }
  .brand { font-size: 18px; }
  .top-actions { gap: 8px; }
  .home-link { font-size: 12px; }
  .add-button { width: 40px; height: 40px; }
  .categories { gap: 4px; }
  .category-name { font-size: 9px; }
  .listing-grid { gap: 9px; }
  .listing-info { padding: 10px; }
  .listing-title { font-size: 15px; }
  .listing-price { font-size: 16px; }
  .action-button { padding: 9px 5px; font-size: 11px; }
  .details-modal { padding: 15px; border-radius: 19px; }
}

@media (min-width: 700px) {
  .search-panel { padding: 18px; }
  .listing-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .details-modal { padding: 26px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
  }
}

/* Larger product photos, compact listing details */
.listing-photo {
  height: 190px;
  min-height: 190px;
  overflow: hidden;
}

.listing-photo img {
  display: block;
  width: 100%;
  height: 190px;
  object-fit: contain;
  padding: 4px;
}

.listing-info {
  padding: 7px;
  gap: 3px;
}

.listing-seller-name {
  margin: 0;
  color: #F6C453;
  font-size: 14px;
  line-height: 1.15;
  font-weight: 900;
}

.listing-title {
  margin: 0;
  font-size: 12px;
  line-height: 1.2;
  font-weight: 600;
}


.listing-price {
  font-size: 15px;
  line-height: 1.2;
  font-weight: 800;
  margin: 0;
}

/* Keep price and Available neatly separated */
.listing-price-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 4px;
  width: 100%;
}

.listing-price-row .listing-price {
  flex: 0 1 auto;
  min-width: 0;
  overflow-wrap: anywhere;
}

.listing-availability {
  display: inline-block;
  flex: 0 0 auto;
  width: fit-content;
  color: #176B45;
  background: #E4F5EA;
  border-radius: 12px;
  padding: 3px 5px;
  font-size: 9px;
  line-height: 1.2;
  font-weight: 700;
  margin: 0;
}

.listing-location {
  color: #D0DAD8;
  font-size: 12px;
  line-height: 1.25;
  font-weight: 600;
  overflow-wrap: anywhere;
  margin-top: 2px;
}

.listing-actions {
  display: flex;
  width: 100%;
  margin-top: 4px;
}

.listing-actions .view-button {
  width: 100%;
  min-height: 30px;
  padding: 6px 3px;
  font-size: 10px;
}
  
</style>
</head>

<body>
<header class="topbar">
  <a class="brand" href="index.html">SHUK<span>AFRICA</span></a>

  <div class="top-actions">
    <a class="home-link" href="index.html">← Home</a>
    <a class="add-button"
       href="open-market-dashboard.html"
       aria-label="Create a listing"
       title="Create a listing">+</a>
  </div>
</header>

<main class="container">
  <h1>OPEN MARKET</h1>
  <p class="tagline">Discover it. Buy it. Sell it.</p>
  <p class="intro">
    Products, shops, home services and job opportunities across Africa.
  </p>

  <section class="search-panel" aria-label="Search Open Market">
    <label class="search-field">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="itemSearch" type="search"
        placeholder="Search by item name or price..."
        aria-label="Search by item name or price">
    </label>

    <label class="search-field">
      <span class="search-icon" aria-hidden="true">⌖</span>
      <input id="locationSearch" type="search"
        placeholder="Search by city, town or country..."
        aria-label="Search by area, region or country">
    </label>
  </section>

  <nav class="categories" aria-label="Listing categories">
    <button class="category-button active" type="button"
      data-category="all" aria-pressed="true">
      <span class="category-icon">🛍️</span>
      <span class="category-name">All</span>
    </button>

    <button class="category-button" type="button"
      data-category="shop" aria-pressed="false">
      <span class="category-icon">🏪</span>
      <span class="category-name">Shop</span>
    </button>

    <button class="category-button" type="button"
      data-category="store" aria-pressed="false">
      <span class="category-icon">🛒</span>
      <span class="category-name">Store</span>
    </button>

    <button class="category-button" type="button"
      data-category="home-service" aria-pressed="false">
      <span class="category-icon">🏠</span>
      <span class="category-name">Home Service</span>
    </button>

    <button class="category-button" type="button"
      data-category="jobs" aria-pressed="false">
      <span class="category-icon">💼</span>
      <span class="category-name">Jobs</span>
    </button>
  </nav>

  <section class="listings-section" aria-labelledby="listingsTitle">
    <div class="listings-heading">
      <h2 id="listingsTitle">Latest Listings</h2>
      <span class="listing-count" id="listingCount">Loading...</span>
    </div>

    <div class="listing-grid" id="listingGrid" aria-live="polite">
      <div class="listing-message">Loading published listings...</div>
    </div>
  </section>
</main>

<!-- View Details modal -->
<div id="detailsOverlay" class="details-overlay" hidden>
  <section class="details-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle">

    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Listing details</h2>
      <button class="modal-close" id="closeDetails" type="button">
        CLOSE
      </button>
    </div>

    <p class="modal-price" id="modalPrice"></p>

    <div class="media-gallery" id="modalGallery"></div>

    <div id="modalFields"></div>

    <div class="modal-actions" id="modalActions"></div>

    <p class="modal-footer-note">
      Confirm details directly with the seller before making payments.
    </p>
  </section>
</div>
  <!-- Fullscreen media viewer -->
<div id="mediaViewer" class="media-viewer" hidden>
  <button id="closeMediaViewer" class="media-viewer-close" type="button">
    ✕
  </button>

  <button id="previousMedia" class="media-viewer-nav" type="button">
    &#10094;
  </button>

  <div id="mediaViewerContent" class="media-viewer-content"></div>

  <button id="nextMedia" class="media-viewer-nav" type="button">
    &#10095;
  </button>

  <p id="mediaViewerCounter" class="media-viewer-counter"></p>
</div>

<script>
(() => {
  "use strict";

  const API_URL = "/api/open-market/listing";

  const categoryButtons = [
    ...document.querySelectorAll("[data-category]")
  ];

  const itemSearch = document.getElementById("itemSearch");
  const locationSearch = document.getElementById("locationSearch");
  const listingGrid = document.getElementById("listingGrid");
  const listingCount = document.getElementById("listingCount");

  const detailsOverlay = document.getElementById("detailsOverlay");
  const closeDetailsButton = document.getElementById("closeDetails");
  const modalTitle = document.getElementById("modalTitle");
  const modalPrice = document.getElementById("modalPrice");
  const modalGallery = document.getElementById("modalGallery");
  const modalFields = document.getElementById("modalFields");
  const modalActions = document.getElementById("modalActions");

  let allListings = [];
  let selectedCategory = "all";
  let lastFocusedElement = null;

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function safeMediaURL(value) {
    if (typeof value !== "string" || !value.trim()) return "";

    try {
      const url = new URL(value.trim(), window.location.origin);

      if (url.protocol !== "https:" && url.protocol !== "http:") {
        return "";
      }

      return url.href;
    } catch {
      return "";
    }
  }

  function categoryLabel(category) {
    const key = String(category || "").toLowerCase().trim();

    const labels = {
      shop: "Shop",
      store: "Store",
      "home-service": "Home Service",
      "home service": "Home Service",
      jobs: "Jobs"
    };

    return labels[key] || (key ? key.replace(/-/g, " ") : "Listing");
  }

  function locationLabel(item) {
    const values = [
      item.location,
      item.region,
      item.country
    ].filter(value => String(value || "").trim());

    return values.filter((value, index) =>
      values.findIndex(other =>
        String(other).toLowerCase() === String(value).toLowerCase()
      ) === index
    ).join(", ");
  }

  function formatPrice(price) {
    if (price === null || price === undefined || String(price).trim() === "") {
      return "Price on request";
    }

    const value = String(price).trim();

    if (/[₵$€£]|GHS|GH₵|CFA|FCFA|XOF|XAF|USD|EUR|negotiable|per month|per day/i.test(value)) {
      return value;
    }

    return "GH₵ " + value;
  }

  function getListingMedia(item) {
    const photos = [
      item.image_1,
      item.image_2,
      item.image_3,
      item.image_4,
      item.image_5
    ]
      .map(safeMediaURL)
      .filter(Boolean);

    const video = safeMediaURL(item.video_url);

    return { photos, video };
  }

  function normalisePhone(value) {
    let phone = String(value || "").trim();

    // Remove common display separators but preserve a leading plus sign.
    phone = phone.replace(/[\s().-]/g, "");

    if (phone.startsWith("00")) {
      phone = "+" + phone.slice(2);
    }

    if (phone.startsWith("+")) {
      return phone.slice(1).replace(/\D/g, "");
    }

    // Ghanaian local numbers: 0XXXXXXXXX -> 233XXXXXXXXX.
    if (/^0\d{9}$/.test(phone)) {
      return "233" + phone.slice(1);
    }

    // A 9-digit Ghanaian number without the leading zero.
    if (/^\d{9}$/.test(phone)) {
      return "233" + phone;
    }

    // For other international numbers, use the digits supplied.
    return phone.replace(/\D/g, "");
  }

  function contactURLs(phone) {
    const digits = normalisePhone(phone);

    if (!digits || digits.length < 7) {
      return { call: "", whatsapp: "" };
    }

    return {
      call: "tel:+" + digits,
      whatsapp: "https://wa.me/" + digits
    };
  }

  function makeContactLink(label, href, className) {
    if (!href) return null;

    const link = document.createElement("a");
    link.className = "modal-contact " + className;
    link.href = href;
    link.textContent = label;

    if (href.startsWith("https://")) {
      link.target = "_blank";
      link.rel = "noopener noreferrer";
    }

    return link;
  }

  function appendDetail(label, value) {
    if (value === null || value === undefined || String(value).trim() === "") {
      return;
    }

    const field = document.createElement("div");
    field.className = "detail-field";

    const heading = document.createElement("span");
    heading.className = "detail-label";
    heading.textContent = label;

    const text = document.createElement("p");
    text.className = "detail-value";
    text.textContent = String(value);

    field.append(heading, text);
    modalFields.appendChild(field);
  }

  const mediaViewer = document.getElementById("mediaViewer");
const mediaViewerContent = document.getElementById("mediaViewerContent");
const mediaViewerCounter = document.getElementById("mediaViewerCounter");
const closeMediaViewerButton = document.getElementById("closeMediaViewer");
const previousMediaButton = document.getElementById("previousMedia");
const nextMediaButton = document.getElementById("nextMedia");

let viewerMedia = [];
let viewerIndex = 0;
let lastTapTime = 0;

function showViewerMedia() {
  mediaViewerContent.replaceChildren();

  const current = viewerMedia[viewerIndex];

  if (current.type === "video") {
    const video = document.createElement("video");
    video.src = current.url;
    video.controls = true;
    video.autoplay = true;
    video.playsInline = true;
    video.preload = "metadata";
    mediaViewerContent.appendChild(video);
  } else {
    const image = document.createElement("img");
    image.src = current.url;
    image.alt = "Enlarged listing photo";

    image.addEventListener("click", () => {
      const now = Date.now();

      if (now - lastTapTime < 300) {
        image.classList.toggle("zoomed");
      }

      lastTapTime = now;
    });

    image.addEventListener("dblclick", () => {
      image.classList.toggle("zoomed");
    });

    mediaViewerContent.appendChild(image);
  }

  mediaViewerCounter.textContent =
    (viewerIndex + 1) + " / " + viewerMedia.length;

  previousMediaButton.hidden = viewerMedia.length < 2;
  nextMediaButton.hidden = viewerMedia.length < 2;
}

function openMediaViewer(index) {
  viewerIndex = index;
  showViewerMedia();
  mediaViewer.hidden = false;
}

function closeMediaViewer() {
  const video = mediaViewerContent.querySelector("video");

  if (video) {
    video.pause();
    video.removeAttribute("src");
    video.load();
  }

  mediaViewer.hidden = true;
  mediaViewerContent.replaceChildren();
}

closeMediaViewerButton.addEventListener("click", closeMediaViewer);

previousMediaButton.addEventListener("click", () => {
  viewerIndex =
    (viewerIndex - 1 + viewerMedia.length) % viewerMedia.length;
  showViewerMedia();
});

nextMediaButton.addEventListener("click", () => {
  viewerIndex = (viewerIndex + 1) % viewerMedia.length;
  showViewerMedia();
});

mediaViewer.addEventListener("click", event => {
  if (event.target === mediaViewer) {
    closeMediaViewer();
  }
});
  
  function openDetails(item) {
    lastFocusedElement = document.activeElement;

    modalTitle.textContent = item.title || "Listing details";
    modalPrice.textContent = formatPrice(item.price);

    modalGallery.replaceChildren();
    modalFields.replaceChildren();
    modalActions.replaceChildren();

    const media = getListingMedia(item);
    let mediaCount = 0;

    media.photos.forEach((url, index) => {
      const figure = document.createElement("div");
      figure.className = "gallery-item";

      const image = document.createElement("img");
      image.src = url;
      image.alt = (item.title || "Listing") + " photo " + (index + 1);
      image.loading = "lazy";

      image.addEventListener("error", () => {
        figure.remove();
        if (!modalGallery.querySelector(".gallery-item")) {
          showNoMedia();
        }
      });

      figure.appendChild(image);
      modalGallery.appendChild(figure);
      mediaCount++;
    });

    if (media.video) {
      const figure = document.createElement("div");
      figure.className = "gallery-item";

      const video = document.createElement("video");
      video.src = media.video;
      video.controls = true;
      video.preload = "metadata";
      video.playsInline = true;

      figure.appendChild(video);
      modalGallery.appendChild(figure);
      mediaCount++;
    }

    function showNoMedia() {
      if (modalGallery.querySelector(".no-media")) return;

      const message = document.createElement("div");
      message.className = "no-media";
      message.textContent =
        "No additional photos or video are available for this listing.";
      modalGallery.appendChild(message);
    }

    if (!mediaCount) showNoMedia();

    appendDetail("Category", categoryLabel(item.category));
    appendDetail("Job type", item.job_type);
    appendDetail("Availability", item.availability || item.status || "Published");
    appendDetail("Condition", item.condition);
    appendDetail("Location", locationLabel(item) || "Location not provided");
    appendDetail("Description", item.description);
    appendDetail("Seller", item.seller_name);
    appendDetail("Contact", item.contact);
    appendDetail("Delivery", item.delivery);

    if (item.terms) {
      appendDetail("Terms and instructions", item.terms);
    }

    const contacts = contactURLs(item.contact);

    const callLink = makeContactLink("CALL SELLER", contacts.call, "");
    const whatsappLink = makeContactLink(
      "WHATSAPP",
      contacts.whatsapp,
      "modal-whatsapp"
    );

    if (callLink) modalActions.appendChild(callLink);
    if (whatsappLink) modalActions.appendChild(whatsappLink);

    if (!callLink && !whatsappLink) {
      const message = document.createElement("p");
      message.className = "detail-value";
    message.textContent = "Seller contact details are unavailable.";
      modalActions.appendChild(message);
    }

    detailsOverlay.hidden = false;
    document.body.classList.add("modal-open");
    closeDetailsButton.focus();
  }

  function closeDetails() {
    // Stop any playing video when closing the modal.
    modalGallery.querySelectorAll("video").forEach(video => {
      video.pause();
      video.removeAttribute("src");
      video.load();
    });

    detailsOverlay.hidden = true;
    document.body.classList.remove("modal-open");
if (lastFocusedElement && typeof lastFocusedElement.focus === "function") {
      lastFocusedElement.focus();
    }
  }

  closeDetailsButton.addEventListener("click", closeDetails);

  detailsOverlay.addEventListener("click", event => {
    if (event.target === detailsOverlay) closeDetails();
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && !detailsOverlay.hidden) {
      closeDetails();
    }
  });

function renderListings() {
  const searchTerm = itemSearch.value.trim().toLowerCase();
  const locationTerm = locationSearch.value.trim().toLowerCase();

  const filtered = allListings.filter(item => {
    const category = String(item.category || "").toLowerCase().trim();

    const categoryMatch =
      selectedCategory === "all" ||
      category === selectedCategory ||
      (selectedCategory === "home-service" && category === "home service");

    const searchableText = [
      item.title,
      item.price,
      item.description,
      item.seller_name,
      item.category,
      item.job_type
    ].join(" ").toLowerCase();

    // Use only the listing's main location field.
    const place = String(item.location || "").toLowerCase();

    return categoryMatch &&
      searchableText.includes(searchTerm) &&
      place.includes(locationTerm);
  });

  listingCount.textContent =
    filtered.length + (filtered.length === 1 ? " listing" : " listings");

  if (filtered.length === 0) {
    listingGrid.replaceChildren();

    const message = document.createElement("div");
    message.className = "listing-message";
    message.textContent = allListings.length === 0
      ? "No published listings are available yet."
      : "No listings match your search. Try another search or category.";

    listingGrid.appendChild(message);
    return;
  }

  listingGrid.replaceChildren();

  filtered.forEach(item => {
    const card = document.createElement("article");
    card.className = "listing-card";

    const photoBox = document.createElement("div");
    photoBox.className = "listing-photo";

    const media = getListingMedia(item);

    if (media.photos.length) {
      const image = document.createElement("img");
      image.src = media.photos[0];
      image.alt = item.title || "Listing photo";
      image.loading = "lazy";

      image.addEventListener("error", () => {
        image.remove();

        if (!photoBox.querySelector(".photo-placeholder")) {
          const placeholder = document.createElement("span");
          placeholder.className = "photo-placeholder";
          placeholder.textContent = "🛍️";
          placeholder.setAttribute("aria-label", "Image unavailable");
          photoBox.prepend(placeholder);
        }
      });

      photoBox.appendChild(image);
    } else {
      const placeholder = document.createElement("span");
      placeholder.className = "photo-placeholder";
      placeholder.textContent = "🛍️";
      placeholder.setAttribute("aria-label", "No listing photo");
      photoBox.appendChild(placeholder);
    }

    const categoryBadge = document.createElement("span");
    categoryBadge.className = "listing-category";
    categoryBadge.textContent = categoryLabel(item.category);
    photoBox.appendChild(categoryBadge);

    const info = document.createElement("div");
    info.className = "listing-info";

    const sellerName = document.createElement("h3");
    sellerName.className = "listing-seller-name";
    sellerName.textContent = item.seller_name || "Seller";
    sellerName.title = sellerName.textContent;

    const title = document.createElement("div");
    title.className = "listing-title";
    title.textContent = item.title || "Untitled listing";
    
const priceRow = document.createElement("div");
priceRow.className = "listing-price-row";

const price = document.createElement("div");
price.className = "listing-price";
price.textContent = formatPrice(item.price);

const availability = document.createElement("span");
availability.className = "listing-availability";
availability.textContent = "● Available";

priceRow.append(price, availability);

const location = document.createElement("div");
location.className = "listing-location";
location.textContent =
  "⌖ " + (String(item.location || "").trim() || "Location not provided");

const actions = document.createElement("div");
actions.className = "listing-actions";

    const viewButton = document.createElement("button");
    viewButton.type = "button";
    viewButton.className = "action-button view-button";
    viewButton.textContent = "VIEW DETAILS";
    viewButton.addEventListener("click", () => openDetails(item));

    actions.appendChild(viewButton);

    info.append(
  sellerName,
  title,
  priceRow,
  location,
  actions
);

    card.append(photoBox, info);
    listingGrid.appendChild(card);
  });
}

  categoryButtons.forEach(button => {
    button.addEventListener("click", () => {
      selectedCategory = button.dataset.category;
categoryButtons.forEach(other => {
        const active = other === button;
        other.classList.toggle("active", active);
        other.setAttribute("aria-pressed", String(active));
      });

      renderListings();
    });
  });

  itemSearch.addEventListener("input", renderListings);
  locationSearch.addEventListener("input", renderListings);

  async function loadListings() {
    listingGrid.innerHTML =
      '<div class="listing-message">Loading published listings...</div>';

    try {
      const response = await fetch(API_URL + "?limit=100", {
        method: "GET",
        headers: { "Accept": "application/json" },
        cache: "no-store"
      });

      let data = {};
try {
        data = await response.json();
      } catch {
        throw new Error("The server returned an invalid response.");
      }

      if (!response.ok || data.success === false) {
        throw new Error(
          data.message || data.error || "The listings could not be loaded."
        );
      }

      if (!Array.isArray(data.listings)) {
        throw new Error("The listings response was not in the expected format.");
      }

      allListings = data.listings;
      renderListings();

    } catch (error) {
      console.error("Open Market listings error:", error);

      listingCount.textContent = "Unavailable";
      listingGrid.innerHTML = "";
const message = document.createElement("div");
      message.className = "listing-message error";
      message.textContent =
        "We couldn't load listings right now. Please refresh the page and try again.";

      listingGrid.appendChild(message);
    }
  }

  loadListings();
})();
</script>
</body>
</html>
