<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071112">
<title>ShukAfrica Open Market</title>

<style>
:root {
  --bg: #071112;
  --panel: #101d1e;
  --border: #263738;
  --gold: #ffb52e;
  --muted: #a8b6b3;
  --green: #00a875;
  --white: #ffffff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--white);
  font-family: Arial, sans-serif;
}

a { color: inherit; text-decoration: none; }

.topbar {
  border-bottom: 1px solid var(--border);
  padding: 16px 4%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand {
  font-size: clamp(19px, 4vw, 28px);
  font-weight: 900;
  letter-spacing: -.7px;
}

.brand span { color: var(--gold); }

.top-actions {
  display: flex;
  align-items: center;
  gap: 15px;
}

.home-link {
  color: var(--gold);
  font-weight: 700;
}

.add-button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 44px;
  border: 0;
  border-radius: 13px;
  background: var(--green);
  color: white;
  font-size: 29px;
  line-height: 1;
  font-weight: 400;
  cursor: pointer;
  flex-shrink: 0;
}

.add-button:hover { filter: brightness(1.1); }

.container {
  width: 92%;
  max-width: 1000px;
  margin: auto;
  padding: 20px 0 35px;
}

h1 {
  font-size: clamp(29px, 6vw, 42px);
  margin: 4px 0 14px;
  line-height: 1.1;
}

.tagline {
  color: var(--gold);
  font-weight: 700;
  font-size: 18px;
  margin: 0 0 12px;
}

.intro {
  color: var(--muted);
  line-height: 1.5;
  margin: 0 0 23px;
}

.search-panel {
  background: #0d1a1a;
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 14px;
  display: grid;
  gap: 10px;
  margin-bottom: 20px;
}

.search-field {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  min-height: 54px;
  border: 1px solid #344544;
  border-radius: 15px;
  padding: 0 14px;
  background: #091515;
}

.search-icon {
  color: var(--gold);
  font-size: 23px;
  flex-shrink: 0;
}

.search-field input {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: white;
  font-size: 15px;
}

.search-field input::placeholder { color: var(--muted); }

.categories {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 7px;
  margin: 0 0 27px;
}

.category-button {
  min-width: 0;
  min-height: 64px;
  padding: 9px 3px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  color: white;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
}

.category-button .category-icon { font-size: 21px; }

.category-button .category-name {
  font-size: clamp(10px, 2.6vw, 13px);
  line-height: 1.15;
  text-align: center;
  overflow-wrap: anywhere;
}

.category-button.active {
  border-color: var(--gold);
  background: #20251d;
  color: var(--gold);
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin: 0 0 15px;
}

.section-heading h2 {
  font-size: 22px;
  margin: 0;
}

#listingCount {
  color: var(--muted);
  font-size: 14px;
  white-space: nowrap;
}

.listings {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.listing-card {
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--panel);
}

.listing-image {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / .86;
  background: #0b1717;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.listing-image img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.no-image {
  color: var(--muted);
  font-size: 34px;
}

.listing-badge {
  position: absolute;
  top: 10px;
  left: 9px;
  z-index: 1;
  max-width: calc(100% - 18px);
  padding: 7px 10px;
  border-radius: 0 10px 10px 0;
  background: rgba(7, 17, 18, .90);
  color: var(--gold);
  font-size: clamp(9px, 2.3vw, 13px);
  font-weight: 800;
  line-height: 1.15;
  overflow-wrap: anywhere;
  pointer-events: none;
}

.listing-info { padding: 12px; }

.listing-title {
  font-size: 17px;
  line-height: 1.3;
  margin: 0 0 8px;
  overflow-wrap: anywhere;
}

.listing-location {
  color: var(--muted);
  font-size: 13px;
  margin: 0 0 12px;
  overflow-wrap: anywhere;
}

.listing-price {
  color: var(--gold);
  font-size: 18px;
  font-weight: 800;
  margin: 0 0 13px;
  overflow-wrap: anywhere;
}

.listing-description {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}

.empty-state {
  grid-column: 1 / -1;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px 16px;
  text-align: center;
  color: var(--muted);
  line-height: 1.6;
}

.manage {
  display: block;
  margin-top: 25px;
  padding: 16px;
  text-align: center;
  background: #142425;
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--gold);
  font-weight: 700;
}

@media (max-width: 360px) {
  .topbar { padding-left: 3%; padding-right: 3%; }
  .brand { font-size: 18px; }
  .top-actions { gap: 8px; }
  .home-link { font-size: 12px; }
  .add-button { width: 40px; height: 40px; }
  .categories { gap: 4px; }
  .category-button { padding-left: 2px; padding-right: 2px; }
  .listing-info { padding: 9px; }
  .listing-title { font-size: 15px; }
}

@media (min-width: 700px) {
  .listings { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .search-panel { padding: 18px; }
}
</style>
</head>

<body>

<header class="topbar">
  <a class="brand" href="index.html">
    SHUK<span>AFRICA</span>
  </a>

  <div class="top-actions">
    <a class="home-link" href="index.html">← Home</a>
    <a class="add-button"
       href="open-market-listing.html"
       aria-label="Create a listing"
       title="Create a listing">+</a>
  </div>
</header>

<main class="container">
  <h1>OPEN MARKET</h1>
  <p class="tagline">Discover it. Buy it. Sell it.</p>
  <p class="intro">
    Products, shops, home services and job opportunities across Africa.
  </p>

  <section class="search-panel" aria-label="Search Open Market">
    <label class="search-field">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input
        id="itemSearch"
        type="search"
        placeholder="Search by item name or price..."
        aria-label="Search by item name or price">
    </label>

    <label class="search-field">
      <span class="search-icon" aria-hidden="true">⌖</span>
      <input
        id="locationSearch"
        type="search"
        placeholder="Search by city, town or country..."
        aria-label="Search by area, region or country">
    </label>
  </section>

  <nav class="categories" aria-label="Listing categories">
    <button class="category-button active" type="button" data-category="all">
      <span class="category-icon" aria-hidden="true">🛍️</span>
      <span class="category-name">All</span>
    </button>
    <button class="category-button" type="button" data-category="shop">
      <span class="category-icon" aria-hidden="true">🏪</span>
      <span class="category-name">Shop</span>
    </button>
    <button class="category-button" type="button" data-category="store">
      <span class="category-icon" aria-hidden="true">🛒</span>
      <span class="category-name">Store</span>
    </button>
    <button class="category-button" type="button" data-category="home-service">
      <span class="category-icon" aria-hidden="true">🏠</span>
      <span class="category-name">Home Service</span>
    </button>
    <button class="category-button" type="button" data-category="jobs">
      <span class="category-icon" aria-hidden="true">💼</span>
      <span class="category-name">Jobs</span>
    </button>
  </nav>

  <section aria-label="Latest listings">
    <div class="section-heading">
      <h2 id="sectionTitle">Latest Listings</h2>
      <span id="listingCount"></span>
    </div>

    <div id="listings" class="listings" aria-live="polite">
      <div class="empty-state">Loading listings…</div>
    </div>
  </section>

  <a class="manage" href="manage-listings.html">
    📋 Manage My Listings →
  </a>
</main>

<script>
(function () {
  const API_URL = "/api/open-market/listings";

  const itemSearch = document.getElementById("itemSearch");
  const locationSearch = document.getElementById("locationSearch");
  const listingsContainer = document.getElementById("listings");
  const listingCount = document.getElementById("listingCount");
  const sectionTitle = document.getElementById("sectionTitle");
  const categoryButtons = document.querySelectorAll("[data-category]");

  let allListings = [];
  let selectedCategory = "all";
  let loadFailed = false;

  function text(value) {
    return value == null ? "" : String(value);
  }

  function normalize(value) {
    return text(value).trim().toLowerCase();
  }

  function escapeHTML(value) {
    return text(value).replace(/[&<>"']/g, function (character) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character];
    });
  }

  function categoryOf(listing) {
    const category = normalize(listing.category);

    if (category.includes("home-service") ||
        category.includes("home service")) {
      return "home-service";
    }

    if (category.includes("worker") ||
        category.includes("seeking job") ||
        category.includes("looking for work") ||
        category === "jobs" ||
        category.includes("job")) {
      return "jobs";
    }

    if (category.includes("store")) return "store";
    if (category.includes("shop")) return "shop";

    return category;
  }

  function badgeOf(listing) {
    const category = categoryOf(listing);

    if (category === "home-service") return "HOME SERVICE";
    if (category === "shop") return "SHOP";
    if (category === "store") return "STORE";

    const original = normalize(listing.category);
    if (original.includes("seeking job") ||
        original.includes("looking for work")) {
      return "SEEKING JOB";
    }

    if (original.includes("worker")) return "WORKERS NEEDED";
    if (category === "jobs") return "JOBS";

    return text(listing.category || "LISTING").toUpperCase();
  }

  function priceOf(listing) {
    if (listing.price_ghs !== undefined &&
        listing.price_ghs !== null &&
        listing.price_ghs !== "") {
      const price = Number(listing.price_ghs);

      if (Number.isFinite(price)) {
        return "GH₵ " + price.toLocaleString("en-GH", {
          maximumFractionDigits: 2
        });
      }
    }

    return text(listing.price || "Contact for price");
  }

  function imageOf(listing) {
    return listing.image_1 ||
           listing.image_url ||
           listing.image ||
           "";
  }

  function matchesSearch(listing) {
    const query = normalize(itemSearch.value);
    const location = normalize(locationSearch.value);

    const title = normalize(
      listing.item_name || listing.title || listing.name
    );
    const price = normalize(priceOf(listing));
    const description = normalize(listing.description);
    const area = normalize(listing.location);
    const category = categoryOf(listing);

    const matchesText = !query ||
      title.includes(query) ||
      price.includes(query) ||
      description.includes(query);

    const matchesLocation = !location || area.includes(location);

    const matchesCategory = selectedCategory === "all" ||
      category === selectedCategory;

    return matchesText && matchesLocation && matchesCategory;
  }

  function renderListings() {
    const filtered = allListings.filter(matchesSearch);

    sectionTitle.textContent = selectedCategory === "all"
      ? "Latest Listings"
      : selectedCategory === "home-service"
        ? "Home Services"
        : selectedCategory === "jobs"
          ? "Jobs"
          : selectedCategory === "shop"
            ? "Shops"
            : "Stores";

    listingCount.textContent =
      filtered.length + (filtered.length === 1 ? " listing" : " listings");

    if (filtered.length === 0) {
      listingsContainer.innerHTML =
        '<div class="empty-state">' +
        (loadFailed
          ? "Open Market listings are not connected yet. The API must be deployed before listings can appear."
          : "No listings match your search yet. Try another search or category.") +
        "</div>";
      return;
    }

    listingsContainer.innerHTML = filtered.map(function (listing) {
      const title = listing.item_name || listing.title || listing.name || "Untitled listing";
      const location = listing.location || "Location not provided";
      const description = listing.description || "";
      const image = imageOf(listing);
      const badge = badgeOf(listing);

      const imageMarkup = image
        ? '<img src="' + escapeHTML(image) + '" alt="' +
          escapeHTML(title) + '" loading="lazy" onerror="this.remove();this.parentElement.insertAdjacentHTML(\'beforeend\',\'<span class=&quot;no-image&quot;>▧</span>\')">'
        : '<span class="no-image" aria-label="No image">▧</span>';

      return (
        '<article class="listing-card">' +
          '<div class="listing-image">' +
            imageMarkup +
            '<span class="listing-badge">' + escapeHTML(badge) + '</span>' +
          '</div>' +
          '<div class="listing-info">' +
            '<h3 class="listing-title">' + escapeHTML(title) + '</h3>' +
            '<p class="listing-location">⌖ ' + escapeHTML(location) + '</p>' +
            '<p class="listing-price">' + escapeHTML(priceOf(listing)) + '</p>' +
            (description
              ? '<p class="listing-description">' +
                escapeHTML(description.length > 100
                  ? description.slice(0, 100) + "…"
                  : description) +
                '</p>'
              : '') +
          '</div>' +
        '</article>'
      );
    }).join("");
  }

  categoryButtons.forEach(function (button) {
    button.addEventListener("click", function () {
      selectedCategory = button.dataset.category;

      categoryButtons.forEach(function (item) {
        const active = item === button;
        item.classList.toggle("active", active);
        item.setAttribute("aria-pressed", String(active));
      });

      renderListings();
    });

    button.setAttribute(
      "aria-pressed",
      String(button.dataset.category === "all")
    );
  });

  itemSearch.addEventListener("input", renderListings);
  locationSearch.addEventListener("input", renderListings);

  async function loadListings() {
    try {
      const response = await fetch(API_URL, {
        method: "GET",
        headers: { "Accept": "application/json" },
        cache: "no-store"
      });

      if (!response.ok) throw new Error("Listings API unavailable");

      const data = await response.json();

      if (!data.success || !Array.isArray(data.listings)) {
        throw new Error("Unexpected listings response");
      }

      allListings = data.listings;
      loadFailed = false;
    } catch (error) {
      allListings = [];
      loadFailed = true;
    }

    renderListings();
  }

  loadListings();
})();
</script>

</body>
</html>
