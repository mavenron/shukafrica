<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ShukAfrica Open Market</title>

  <style>
    :root{
      --bg:#071112;
      --panel:#101d1e;
      --panel2:#142425;
      --line:#263738;
      --text:#f5f7f5;
      --muted:#a8b6b3;
      --gold:#d4883a;
      --gold2:#ffb52e;
      --green:#00a86b;
      --blue:#1688db;
      --red:#ed3e35;
      --purple:#a34cdd;
      --radius:18px;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      background:var(--bg);
      color:var(--text);
      font-family:Arial, Helvetica, sans-serif;
      min-height:100vh;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .wrap{
      width:min(1100px, 92%);
      margin:auto;
    }

    /* HEADER */
    header{
      border-bottom:1px solid var(--line);
      background:#081516;
      position:sticky;
      top:0;
      z-index:20;
    }

    .header-inner{
      min-height:70px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
    }

    .brand{
      font-size:22px;
      font-weight:900;
      letter-spacing:.5px;
    }

    .brand span{
      color:var(--gold2);
    }

    .back{
      border:1px solid var(--line);
      background:var(--panel);
      padding:10px 15px;
      border-radius:10px;
      color:var(--muted);
      font-size:13px;
    }

    .back:hover{
      border-color:var(--gold);
      color:white;
    }

    /* HERO */
    .hero{
      text-align:center;
      padding:55px 0 35px;
    }

    .hero-icon{
      font-size:48px;
      margin-bottom:12px;
    }

    .hero h1{
      font-size:clamp(28px,5vw,46px);
      margin-bottom:10px;
    }

    .hero h1 span{
      color:var(--gold2);
    }

    .hero p{
      color:var(--muted);
      max-width:650px;
      margin:auto;
      line-height:1.6;
      font-size:15px;
    }

    /* CHOICE */
    .choice-title{
      text-align:center;
      margin:15px 0 25px;
    }

    .choice-title h2{
      font-size:23px;
      margin-bottom:7px;
    }

    .choice-title p{
      color:var(--muted);
      font-size:13px;
    }

    .market-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:16px;
    }

    .market-card{
      background:linear-gradient(160deg,#142425,#0d191a);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:25px 20px;
      min-height:220px;
      display:flex;
      flex-direction:column;
      transition:.2s ease;
      position:relative;
      overflow:hidden;
    }
