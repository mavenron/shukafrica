<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShukAfrica — Manage My Listings</title>

<style>

:root{
  --bg:#071112;
  --panel:#101d1e;
  --line:#263738;
  --text:#f5f7f5;
  --muted:#a8b6b3;
  --gold:#ffb52e;
  --red:#ed3e35;
  --radius:18px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

a{
  text-decoration:none;
  color:inherit;
}

.wrap{
  width:min(850px,92%);
  margin:auto;
}

header{
  background:#081516;
  border-bottom:1px solid var(--line);
}

.header-inner{
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  font-size:21px;
  font-weight:900;
}

.brand span{
  color:var(--gold);
}

.back{
  padding:9px 13px;
  border:1px solid var(--line);
  border-radius:10px;
  color:var(--muted);
  font-size:12px;
}

.hero{
  text-align:center;
  padding:40px 0 25px;
}

.hero-icon{
  font-size:42px;
  margin-bottom:10px;
}

.hero h1{
  font-size:28px;
  margin-bottom:8px;
}

.hero p{
  color:var(--muted);
  font-size:13px;
}

.actions{
  display:flex;
  gap:10px;
  margin-bottom:25px;
}

.btn{
  border:0;
  border-radius:10px;
  padding:13px 18px;
  font-weight:bold;
  cursor:pointer;
  font-size:13px;
}

.btn-gold{
  background:var(--gold);
  color:#111;
}

.btn-outline{
  background:transparent;
  color:white;
  border:1px solid var(--line);
}

.listing{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:18px;
}

.listing-category{
  display:inline-block;
  color:var(--gold);
  background:#1c292a;
  border:1px solid #60471f;
  border-radius:20px;
  padding:6px 10px;
  font-size:11px;
  font-weight:bold;
  margin-bottom:12px;
}

.listing h2{
  font-size:21px;
  margin-bottom:12px;
}

.info{
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}

.info strong{
  color:white;
}

.description{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #1c292a;
  color:#d7dfdc;
  font-size:13px;
  line-height:1.5;
}

.listing-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:18px;
  padding-top:15px;
  border-top:1px solid #1c292a;
}

.date{
  color:var(--muted);
  font-size:11px;
}

.delete-btn{
  background:transparent;
  color:var(--red);
  border:1px solid #5b2826;
  border-radius:9px;
  padding:9px 13px;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
}

.empty{
  text-align:center;
  padding:45px 20px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
}

.empty-icon{
  font-size:40px;
  margin-bottom:12px;
}

.empty h2{
  margin-bottom:8px;
}

.empty p{
  color:var(--muted);
  font-size:13px;
  margin-bottom:20px;
}

footer{
  margin-top:40px;
  border-top:1px solid var(--line);
  padding:25px;
  text-align:center;
  color:var(--muted);
  font-size:11px;
}

footer strong{
  color:var(--gold);
}

@media(max-width:600px){

  .hero h1{
    font-size:25px;
  }

  .actions{
    flex-direction:column;
  }

  .actions .btn{
    width:100%;
  }

  .listing-footer{
    align-items:flex-start;
    flex-direction:column;
  }

}

</style>
</head>

<body>

<header>

  <div class="wrap header-inner">

    <div class="brand">
      Shuk<span>Africa</span>
    </div>

    <a href="open-market.html" class="back">
      ← Back
    </a>

  </div>

</header>


<main class="wrap">

  <section class="hero">

    <div class="hero-icon">📋</div>

    <h1>Manage My Listings</h1>

    <p>
      View and manage the listings you have published.
    </p>

  </section>


  <div class="actions">

    <a
      href="open-market.html"
      class="btn btn-gold"
    >
      + Create New Listing
    </a>

    <a
      href="index.html"
      class="btn btn-outline"
    >
      Home
    </a>

  </div>


  <div id="listingsContainer"></div>


</main>


<footer>

  <strong>ShukAfrica</strong> — West Africa, connected.

</footer>


<script>

const container =
  document.getElementById("listingsContainer");


function loadListings(){

  const listings =
    JSON.parse(
      localStorage.getItem("shukafricaListings") || "[]"
    );


  container.innerHTML = "";


  if(listings.length === 0){

    container.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🛍️
        </div>

        <h2>No Listings Yet</h2>

        <p>
          You haven't published any listings yet.
        </p>

        <a
          href="open-market.html"
          class="btn btn-gold"
        >
          Create Your First Listing
        </a>

      </div>

    `;

    return;

  }


  listings
    .slice()
    .reverse()
    .forEach(listing => {

      const card =
        document.createElement("div");

      card.className = "listing";


      const date =
        listing.createdAt
          ? new Date(listing.createdAt)
              .toLocaleDateString()
          : "Recently";


      card.innerHTML = `

        <div class="listing-category">
          ${escapeHTML(listing.category || "OPEN MARKET")}
        </div>

        <h2>
          ${escapeHTML(listing.title || "Untitled Listing")}
        </h2>

        <div class="info">

          <div>
            <strong>Name:</strong>
            ${escapeHTML(listing.name || "")}
          </div>

          <div>
            <strong>Contact:</strong>
            ${escapeHTML(listing.contact || "")}
          </div>

          <div>
            <strong>Price:</strong>
            ${escapeHTML(listing.price || "Not specified")}
          </div>

          <div>
            <strong>Location:</strong>
            ${escapeHTML(listing.location || "")}
          </div>

          ${
            listing.delivery
            ? `
              <div>
                <strong>Delivery:</strong>
                ${escapeHTML(listing.delivery)}
              </div>
            `
            : ""
          }

        </div>

        <div class="description">
          ${escapeHTML(listing.description || "")}
        </div>

        <div class="listing-footer">

          <div class="date">
            Published: ${date}
          </div>

          <button
            class="delete-btn"
            onclick="deleteListing(${listing.id})"
          >
            🗑️ Delete
          </button>

        </div>

      `;


      container.appendChild(card);

    });

}


function deleteListing(id){

  const confirmDelete =
    confirm(
      "Are you sure you want to delete this listing?"
    );


  if(!confirmDelete){
    return;
  }


  let listings =
    JSON.parse(
      localStorage.getItem("shukafricaListings") || "[]"
    );


  listings =
    listings.filter(
      listing => listing.id !== id
    );


  localStorage.setItem(
    "shukafricaListings",
    JSON.stringify(listings)
  );


  loadListings();

}


function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


loadListings();

</script>

</body>
  </html>
