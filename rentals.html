<script>
const rentalImages = document.getElementById("rentalImages");
const imagePreview = document.getElementById("imagePreview");

rentalImages.addEventListener("change", function() {
  imagePreview.innerHTML = "";
  const files = Array.from(this.files);

  if (files.length < 1) {
    alert("Please select at least 1 image.");
    this.value = "";
    return;
  }

  if (files.length > 5) {
    alert("You can upload a maximum of 5 images.");
    this.value = "";
    return;
  }

  for (const file of files) {
    if (file.size > 2 * 1024 * 1024) {
      alert(file.name + " is larger than 2 MB.");
      this.value = "";
      imagePreview.innerHTML = "";
      return;
    }

    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);
    img.style.width = "90px";
    img.style.height = "70px";
    img.style.objectFit = "cover";
    img.style.borderRadius = "10px";

    imagePreview.appendChild(img);
  }
});

function postRental() {
  const title = document.getElementById("rentalTitle").value.trim();
  const location = document.getElementById("rentalLocation").value.trim();
  const contact = document.getElementById("rentalContact").value.trim();
  const condition = document.getElementById("rentalCondition").value;
  const terms = document.getElementById("rentalTerms").value.trim();
  const description = document.getElementById("rentalDescription").value.trim();
  const price = document.getElementById("rentalPrice").value.trim();

  const availability = document.querySelector(
    'input[name="availability"]:checked'
  )?.value || "Available";

  const files = Array.from(rentalImages.files);

  if (!title || !description) {
    alert("Please enter the rental headline and description.");
    return;
  }

  if (files.length < 1) {
    alert("Please select at least 1 rental photo.");
    return;
  }

  const listing = document.getElementById("rentalListings");
  const mainImage = URL.createObjectURL(files[0]);

  let otherImages = "";

  files.slice(1).forEach(file => {
    const imageUrl = URL.createObjectURL(file);
    otherImages += `
      <img
        src="${imageUrl}"
        onclick="window.open(this.src, '_blank')"
        style="
          width:90px;
          height:70px;
          object-fit:cover;
          border-radius:10px;
          cursor:zoom-in;
        "
        alt="Rental photo"
        onerror="this.style.display='none'"
      >
    `;
  });

  const cardHTML = `
    <div class="rental-card" style="
      margin-top:20px;
      padding:18px;
      border:1px solid #263738;
      border-radius:18px;
      background:#101d1e;
    ">
      <a href="javascript:void(0)" onclick="window.open('${mainImage}', '_blank')">
        <img src="${mainImage}" style="
          width:100%;
          height:220px;
          object-fit:cover;
          border-radius:14px;
          display:block;
          margin-bottom:15px;
          cursor:zoom-in;
        ">
      </a>

      <h2 style="margin-top:0;">${title}</h2>

      <p>${description}</p>

      <div style="
        color:${availability === "Available" ? "#00a86b" : "#ed3e35"};
        font-weight:bold;
        margin-bottom:15px;
      ">
        ${availability === "Available" ? "🟢 AVAILABLE" : "🔴 NOT AVAILABLE"}
      </div>

      <div style="color:#ffb52e; font-size:18px; font-weight:bold; margin:10px 0;">
        💰 ${price || "Price not provided"}
      </div>

      <div style="color:#a8b6b3; margin:8px 0;">
        📍 ${location || "Location not provided"}
      </div>

      <button
        type="button"
        onclick="editRental(this)"
        style="
          margin-top:10px;
          margin-right:8px;
          border:0;
          border-radius:999px;
          background:#ffb52e;
          color:#111;
          padding:11px 16px;
          font-weight:800;
          cursor:pointer;
        "
      >
        ✏️ EDIT RENTAL
      </button>

      <button
        type="button"
        onclick="this.closest('.rental-card').remove()"
        style="
          margin-top:10px;
          margin-right:8px;
          border:0;
          border-radius:999px;
          background:#ed3e35;
          color:white;
          padding:11px 16px;
          font-weight:800;
          cursor:pointer;
        "
      >
        🗑️ DELETE RENTAL
      </button>

      <button
        type="button"
        onclick="const details = this.nextElementSibling; details.style.display = details.style.display === 'none' ? 'block' : 'none';"
        style="
          border:0;
          border-radius:999px;
          background:#ffb52e;
          color:#111;
          padding:11px 16px;
          font-weight:800;
          cursor:pointer;
        "
      >
        VIEW DETAILS →
      </button>

      <div style="display:none; margin-top:15px;">
        <h3>PHOTOS</h3>
        <div style="display:flex; flex-wrap:wrap; gap:10px;">
          <img src="${mainImage}" style="width:90px; height:70px; object-fit:cover; border-radius:10px;">
          ${otherImages}
        </div>

        <h3>CONTACT</h3>
        <p style="font-size:16px; font-weight:bold;">
          📞 ${contact || "Contact not provided"}
        </p>

        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;">
          <a href="tel:${contact}" style="text-decoration:none; background:#00a86b; color:white; padding:11px 18px; border-radius:999px; font-weight:800; display:inline-block;">
            📞 CALL
          </a>
          <a href="https://wa.me/${contact.replace(/[^0-9]/g, '')}" target="_blank" style="text-decoration:none; background:#25D366; color:white; padding:11px 18px; border-radius:999px; font-weight:800; display:inline-block;">
            💬 WHATSAPP
          </a>
        </div>

        <h3>CONDITION</h3>
        <p>🛠️ ${condition}</p>

        <h3>RENTAL TERMS & REQUIREMENTS</h3>
        <p>${terms || "No special rental terms provided."}</p>
      </div>
    </div>
  `;

  listing.insertAdjacentHTML("beforeend", cardHTML);

  alert("Your rental listing has been posted!");
}

function editRental(button) {
  const card = button.closest(".rental-card");
  if (!card) return;

  const title = card.querySelector("h2")?.textContent || "";
  const description = card.querySelector("p")?.textContent || "";

  document.getElementById("rentalTitle").value = title;
  document.getElementById("rentalDescription").value = description;

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}
</script>
