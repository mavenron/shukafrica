<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rentals — ShukAfrica</title>

  <style>
    :root{
      --bg:#071112;
      --panel:#101d1e;
      --line:#263738;
      --text:#f5f7f5;
      --muted:#a8b6b3;
      --gold:#ffb52e;
      --green:#00a86b;
      --red:#ed3e35;
      --radius:18px;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Arial,sans-serif;
    }

    .wrap{
      width:min(900px,calc(100% - 28px));
      margin:auto;
    }

    header{
      border-bottom:1px solid var(--line);
      background:#071112;
      padding:18px 0;
    }

    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .brand{
      font-size:23px;
      font-weight:800;
    }

    .brand span{
      color:var(--gold);
    }

    .back{
      color:var(--gold);
      text-decoration:none;
      font-size:13px;
      font-weight:700;
    }

    main{
      padding:30px 0 50px;
    }

    h1{
      margin:0;
      font-size:32px;
    }

    .intro{
      color:var(--muted);
      margin:7px 0 28px;
      font-size:14px;
    }

    .form-box{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:22px;
    }

    .field{
      margin-bottom:20px;
    }

    label{
      display:block;
      font-size:12px;
      font-weight:800;
      letter-spacing:.6px;
      margin-bottom:8px;
    }

    input,
    textarea,
    select{
      width:100%;
      border:1px solid #354647;
      background:#0b1819;
      color:white;
      border-radius:11px;
      padding:13px;
      outline:none;
    }

    textarea{
  min-height:160px;
  resize:vertical;
  line-height:1.5;
}

textarea:focus{
  border-color:#ffb52e;
    }

    .availability{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .availability label{
      margin:0;
    }

    .availability input{
      display:none;
    }

    .availability span{
      display:block;
      text-align:center;
      padding:13px;
      border:1px solid #354647;
      border-radius:11px;
      cursor:pointer;
    }

    .availability input:checked + span{
      border-color:var(--green);
      background:#09271f;
    }

    .images{
      border:1px dashed #50605f;
      border-radius:12px;
      padding:20px;
      text-align:center;
      color:var(--muted);
    }

    .post{
      width:100%;
      border:0;
      border-radius:999px;
      background:var(--gold);
      color:#111;
      padding:14px;
      font-weight:800;
      cursor:pointer;
      font-size:14px;
    }

    .note{
      margin-top:18px;
      padding:13px;
      border-radius:10px;
      background:#171d1d;
      color:var(--muted);
      font-size:11px;
      text-align:center;
    }

    @media(max-width:600px){
      h1{
        font-size:27px;
      }

      .form-box{
        padding:17px;
      }
    }
</style>
</head>

<body>
<header>
  <div class="wrap top">
    <div class="brand">
      SHUK<span>AFRICA</span>
    </div>

    <a href="index.html" class="back">← Back</a>
  </div>
</header>

<main>
  <div class="wrap">

    <h1>RENTALS</h1>

    <p class="intro">
      Rent products, properties and equipment across the region.
    </p>

    <div class="form-box">

      <div class="field">
  <label>RENTAL TITLE / HEADLINE</label>
  <input type="text" placeholder="e.g. 3 BEDROOM APARTMENT">
</div>

<div class="field">
  <label>DESCRIPTION</label>
  <textarea placeholder="Describe the rental, features, facilities and other important details..."></textarea>
</div>

      <div class="field">
  <label>PHOTOS</label>

  <input
    type="file"
    id="rentalImages"
    accept="image/*"
    multiple
  >

  <small style="display:block;margin-top:8px;color:#a8b6b3;">
    1–5 images required • Maximum 2 MB per image
  </small>

  <div id="imagePreview" style="
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:12px;
  "></div>
      </div>

      <div class="field">
        <label>PRICE</label>
        <input type="text" placeholder="e.g. GH₵ 3,000/month">
      </div>

      <div class="field">
        <label>AVAILABILITY</label>

        <div class="availability">
          <label>
            <input type="radio" name="availability" checked>
            <span>🟢 Available</span>
          </label>

          <label>
            <input type="radio" name="availability">
            <span>🔴 Not Available</span>
          </label>
        </div>
      </div>

      <div class="field">
        <label>CONDITION</label>
        <select>
          <option>New</option>
          <option>Good Condition</option>
          <option>Used</option>
          <option>Needs Repair</option>
        </select>
      </div>

      <div class="field">
        <label>RENTAL TERMS &amp; REQUIREMENTS</label>
        <textarea placeholder="Enter any important rental terms or requirements..."></textarea>
      </div>

      <div class="field">
        <label>LOCATION</label>
        <input type="text" placeholder="City / Town / Area">
      </div>

      <div class="field">
        <label>CONTACT</label>
        <input type="text" placeholder="Phone / WhatsApp">
      </div>

      <button class="post" type="button" onclick="postRental()">
  POST RENTAL
</button>

<div id="rentalListings"></div>
      
  <script>

const rentalImages = document.getElementById("rentalImages");
const imagePreview = document.getElementById("imagePreview");

rentalImages.addEventListener("change", function() {

  imagePreview.innerHTML = "";

  const files = Array.from(this.files);

  if (files.length < 1) {
    alert("Please select at least 1 image.");
    this.value = "";
    return;
  }

  if (files.length > 5) {
    alert("You can upload a maximum of 5 images.");
    this.value = "";
    return;
  }

  for (const file of files) {

    if (file.size > 2 * 1024 * 1024) {
      alert(file.name + " is larger than 2 MB.");
      this.value = "";
      imagePreview.innerHTML = "";
      return;
    }

    const img = document.createElement("img");

    img.src = URL.createObjectURL(file);
    img.style.width = "90px";
    img.style.height = "70px";
    img.style.objectFit = "cover";
    img.style.borderRadius = "10px";

    imagePreview.appendChild(img);
  }

});


function postRental() {

  const title = document.querySelector(
    'input[placeholder*="3 BEDROOM"]'
  )?.value.trim();
const location = document.querySelector(
  'input[placeholder="City / Town / Area"]'
)?.value.trim();
  const contact = document.querySelector(
  'input[placeholder="Phone / WhatsApp"]'
)?.value.trim();
  const condition = document.querySelector('select')?.value;
  const terms = document.querySelector(
  'textarea[placeholder*="important rental terms"]'
)?.value.trim();
  const description = document.querySelector(
    'textarea[placeholder*="Describe the rental"]'
  )?.value.trim();
const price = document.querySelector(
  'input[placeholder*="GH₵"]'
)?.value.trim();
  const files = Array.from(rentalImages.files);

  if (!title || !description) {
    alert("Please enter the rental headline and description.");
    return;
  }

  if (files.length < 1) {
    alert("Please select at least 1 rental photo.");
    return;
  }

  const listing = document.getElementById("rentalListings");

  const mainImage = URL.createObjectURL(files[0]);

  let otherImages = "";

  files.slice(1).forEach(file => {

    const imageUrl = URL.createObjectURL(file);

    otherImages += `
      <img src="${imageUrl}" style="
        width:90px;
        height:70px;
        object-fit:cover;
        border-radius:10px;
      ">
    `;

  });

  listing.innerHTML += `
    <div style="
      margin-top:20px;
      padding:18px;
      border:1px solid #263738;
      border-radius:18px;
      background:#101d1e;
    ">

      <img src="${mainImage}" style="
        width:100%;
        height:220px;
        object-fit:cover;
        border-radius:14px;
        display:block;
        margin-bottom:15px;
      ">

      <h2 style="margin-top:0;">${title}</h2>

      <p>${description}</p>

      <div style="
        color:#00a86b;
        font-weight:bold;
        margin-bottom:15px;
      ">
        🟢 AVAILABLE
      </div>

      <button
        type="button"
        onclick="this.nextElementSibling.style.display =
        this.nextElementSibling.style.display === 'none'
        ? 'block' : 'none'"
        style="
          border:0;
          border-radius:999px;
          background:#ffb52e;
          color:#111;
          padding:11px 16px;
          font-weight:800;
          cursor:pointer;
        "
      >
        VIEW DETAILS →
      </button>

      <div style="
        display:none;
        margin-top:15px;
      ">

        <h3>PHOTOS</h3>

        <div style="
          display:flex;
          flex-wrap:wrap;
          gap:10px;
        ">

          <img src="${mainImage}" style="
            width:90px;
            height:70px;
            object-fit:cover;
            border-radius:10px;
          ">

          ${otherImages}

        </div>

        <h3>DESCRIPTION</h3>
<h3>CONTACT</h3>

<p style="
  font-size:16px;
  font-weight:bold;
">
  📞 ${contact || "Contact not provided"}
</p>
<h3>CONDITION</h3>

<p>
  🛠️ ${condition}
</p>
        <p>${description}</p>
<div style="
  color:#ffb52e;
  font-size:18px;
  font-weight:bold;
  margin:10px 0;
">
  💰 ${price || "Price not provided"}
</div>
      </div>
<div style="
  color:#a8b6b3;
  margin:8px 0;
">
  📍 ${location || "Location not provided"}
</div>
    </div>
  `;

  alert("Your rental listing has been posted!");

}

</script>


      <div class="note">
        ShukAfrica connects renters with owners. Payment and rental agreements are handled directly between the parties.
      </div>

    </div>

  </div>
</main>

</body>
  </html>
